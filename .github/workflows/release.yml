name: Build Release Binaries

on:
  # 1. Trigger when you push a version tag (e.g., git tag v1.0.0 && git push origin v1.0.0)
  push:
    tags:
      - 'v*'
  # 2. Provide a manual "Run workflow" button in the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            cli_path: build/release/helga-cli
            gui_path: build/release/helga-gui
          - os: windows-latest
            platform: windows
            cli_path: build/release/Release/helga-cli.exe
            gui_path: build/release/Release/helga-gui.exe
          - os: macos-latest
            platform: macos
            cli_path: build/release/helga-cli
            gui_path: build/release/helga-gui

    steps:
    - uses: actions/checkout@v6

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev ccache

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew untap aws/tap || true
        brew install sdl2 ccache

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: vcpkg install --triplet=x64-windows-static

    - name: Configure CMake
      run: cmake --preset release ${{ runner.os == 'Windows' && '-DVCPKG_TARGET_TRIPLET=x64-windows-static' || '' }}
      env:
        CMAKE_TOOLCHAIN_FILE: ${{ runner.os == 'Windows' && 'C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}

    - name: Build
      run: cmake --build build/release --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: helga-${{ matrix.platform }}
        if-no-files-found: error
        path: |
          ${{ matrix.cli_path }}
          ${{ matrix.gui_path }}
